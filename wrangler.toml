{
  "$schema": "./node_modules/wrangler/config-schema.json",

  // ── Worker ────────────────────────────────────────────────
  "name": "one-click-deploy",
  "main": "worker.js",

  // Cloudflare Workers Runtime compatibility date
  "compatibility_date": "2026-09-22",

  // Expose *.workers.dev for testing
  "workers_dev": true,

  // ── KV Namespace ──────────────────────────────────────────
  "kv_namespaces": [
    {
      "binding": "KV",
      "id": "0fe31bd377ec4aa2bbe287e54d5a4873"
    }
  ],

  // ── Scheduled Tasks ──────────────────────────────────────
  // Run at 00:00 UTC on the first day of every month.
  "triggers": {
    "crons": [
      "0 0 1 * *"
    ]
  }
}
