name: Template Library Sync

on:
  schedule:
    # Daily refresh at 00:30 UTC
    - cron: '30 0 * * *'
    # Monthly validation on the 1st day
    - cron: '30 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-template-library:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh template validation
        run: |
          echo "Template library refresh started"
          echo "Run date: $(date -u)"
          npm test

      - name: Bundle verification
        run: npm run check:bundle
