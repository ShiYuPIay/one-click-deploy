name: Scheduled Validation

# Runs daily and on the 1st of each month to catch regressions early.
# Template cache invalidation is handled by the Worker's own cron trigger
# (see wrangler.jsonc) — this workflow validates the code stays healthy.

on:
  schedule:
    # Daily smoke-test at 00:30 UTC
    - cron: '30 0 * * *'
    # Extra bundle check on the 1st of each month
    - cron: '30 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: |
          echo "Validation started: $(date -u)"
          npm test

      - name: Bundle verification
        run: npm run check:bundle

      - name: Report
        if: always()
        run: echo "Validation complete: $(date -u)"
